# Сборка Windows-установщика и macOS-образов на серверах GitHub.
# Запуск: вкладка Actions -> Build -> Run workflow, или push тега v1.2.3 (тогда ещё и черновик релиза).
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    # Run #1 hung on the selftest for the full 6 h: never let a job eat the whole quota again.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: python -m pip install -r requirements-build.txt
      - name: PyInstaller
        run: pyinstaller --noconfirm ParserGod.spec
      # -Wait waited on the whole process tree and hung for 6 h. Wait on the process
      # itself with a 5-minute cap instead; a hang or a failure is reported but
      # doesn't block the installer (the Mac jobs treat their live test the same way).
      - name: Selftest
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 8
        run: |
          $p = Start-Process -FilePath dist\ParserGod\ParserGod.exe -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Host "selftest: no answer in 5 min, killed"; exit 1 }
          Get-Content "$env:LOCALAPPDATA\ParserGod\selftest.txt"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = python -c "from app import brand; print(brand.APP_VERSION)"
          & $iscc /Qp "/DMyAppVersion=$ver" installer.iss
          Compress-Archive -Path dist\ParserGod -DestinationPath "release\ParserGod-$ver-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: release/* }

  macos:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 = Apple Silicon (M1–M4), macos-15-intel = старые Mac на Intel
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build
        run: bash build_mac.sh
      # Живая проверка на настоящем Mac: 3 аптеки в Москве + 3 в Полевском.
      # Не валит сборку: 2ГИС может не пускать серверы GitHub (американские IP) — тогда смотрим отчёт глазами.
      - name: Live test (2GIS)
        continue-on-error: true
        run: |
          set +e
          ls -d "/Applications/Google Chrome.app" || echo "Chrome НЕ найден"
          ./dist/ParserGod.app/Contents/MacOS/ParserGod --selftest --live; code=$?
          echo "===== selftest.txt ====="
          cat "$HOME/Library/Application Support/ParserGod/selftest.txt" || echo "отчёт не найден"
          exit $code
      - uses: actions/upload-artifact@v4
        with: { name: 'mac-${{ matrix.os }}', path: release/*.dmg }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { draft: true, files: 'out/*' }
